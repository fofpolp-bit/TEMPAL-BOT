# Render.com Blueprint for Tempal bot.
# Deployed as a Web Service (free tier supports HTTP services only).
# The bot still uses long polling internally; the /health endpoint exists
# so Render's free tier accepts it as a Web Service and so that an
# external uptime pinger (cron-job.org / UptimeRobot) can keep it awake.
# Set TELEGRAM_BOT_TOKEN, DATABASE_URL (Neon), ALLOWED_CHAT_IDS,
# OPERATE_CHAT_IDS as env vars in the Render dashboard.

services:
  - type: web
    name: tempal-bot
    runtime: python
    plan: free
    region: frankfurt
    branch: initial-setup
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python -m tempal.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: OPERATE_CHAT_IDS
        sync: false
