name: keep-alive

on:
  schedule:
    # Every 10 minutes. GitHub may delay this by a few minutes on the free plan,
    # but it is more than enough to keep the Render free instance from spinning
    # down after 15 minutes of inactivity.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up Render service
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              --connect-timeout 30 --max-time 90 \
              https://tempal-bot.onrender.com/health) || code=000
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "service did not respond 200 after 3 attempts"
          exit 1

